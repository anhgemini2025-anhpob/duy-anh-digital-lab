      <text x="85" y="34" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="800">BJC Sales Training Hub</text>
      <text x="85" y="52" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="600">B2B SALES & ENTERPRISE TRAINING</text>

      <rect x="1180" y="20" width="260" height="34" rx="17" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
