              <text x="36" y="90" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500">Giải pháp khử mùi tanh đạm thực vật và tăng vị umami tự nhiê</text>
              <text x="36" y="114" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="400">n</text>
              
