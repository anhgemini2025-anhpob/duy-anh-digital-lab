              <text x="36" y="114" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="400">Dữ liệu được chuẩn hóa và tự động hóa theo thời gian thực.</text>
              
