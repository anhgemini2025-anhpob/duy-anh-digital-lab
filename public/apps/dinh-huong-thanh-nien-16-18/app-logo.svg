<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1618" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="softGlow1618" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#818CF8" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />
  
  <!-- Subtle Compass / Navigation Ring -->
  <circle cx="60" cy="52" r="34" fill="none" stroke="url(#grad1618)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.35" />
  <circle cx="60" cy="52" r="38" fill="url(#grad1618)" opacity="0.10" />

  <!-- Graduation Cap & Future Career Compass -->
  <!-- Cap Diamond Top -->
  <path d="M60 25 L88 38 L60 51 L32 38 Z" fill="url(#grad1618)" filter="url(#softGlow1618)" />
  <!-- Cap Underside / Head band -->
  <path d="M43 45 L43 55 C43 62 77 62 77 55 L77 45 Z" fill="#1E1B4B" opacity="0.9" />
  <path d="M43 45 L43 55 C43 62 77 62 77 55 L77 45 Z" fill="none" stroke="#818CF8" stroke-width="1.5" />

  <!-- Tassel -->
  <path d="M78 38 L84 46 L84 56" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  <circle cx="84" cy="58" r="2.5" fill="#FBBF24" />

  <!-- Compass Star / Lighthouse Ray of Future (Ikigai / Career) -->
  <path d="M60 58 L63 66 L71 69 L63 72 L60 80 L57 72 L49 69 L57 66 Z" fill="url(#goldGrad)" />
  <circle cx="60" cy="69" r="2" fill="#FFFFFF" />

  <!-- Sparkles -->
  <path d="M26 30 L27.5 26 L29 30 L33 31.5 L29 33 L27.5 37 L26 33 L22 31.5 Z" fill="#FDE047" opacity="0.9" />
  <path d="M92 64 L93.5 61 L95 64 L98 65.5 L95 67 L93.5 70 L92 67 L89 65.5 Z" fill="#FDE047" opacity="0.85" />

  <!-- Bottom Label -->
  <text x="60" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="900" fill="#A5B4FC" text-anchor="middle" letter-spacing="1">TUỔI 16-18</text>
</svg>
