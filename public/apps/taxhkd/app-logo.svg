<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="taxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f766e" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#taxGrad)" filter="url(#softShadow)" />
  
  <!-- Inner Subtle Glow Ring -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Shield Shape Representing Legal & Tax Protection -->
  <path d="M60 26 C44 26 36 34 36 46 C36 68 60 86 60 86 C60 86 84 68 84 46 C84 34 76 26 60 26 Z" fill="#ffffff" fill-opacity="0.12" />

  <!-- Document / Tax Return Form Icon -->
  <rect x="42" y="34" width="36" height="48" rx="6" fill="#ffffff" />
  
  <!-- Document Fold / Header Accent -->
  <path d="M42 40 C42 36.686 44.686 34 48 34 L72 34 C75.314 34 78 36.686 78 40 L78 45 L42 45 Z" fill="#15803d" />

  <!-- Lines on Document (Accounting ledger) -->
  <rect x="48" y="51" width="24" height="3" rx="1.5" fill="#e2e8f0" />
  <rect x="48" y="57" width="18" height="3" rx="1.5" fill="#e2e8f0" />
  <rect x="48" y="63" width="22" height="3" rx="1.5" fill="#cbd5e1" />

  <!-- Percent / Tax Calculation Badge -->
  <circle cx="68" cy="71" r="11" fill="url(#goldGrad)" />
  <text x="68" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">%</text>

  <!-- Bottom Label -->
  <text x="60" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">SMARTTAX</text>
</svg>
