<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="VietNail Guide AI">
  <defs>
    <!-- Background Gradient: Deep Flag Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2C59" />
      <stop offset="50%" stop-color="#0B2447" />
      <stop offset="100%" stop-color="#06162E" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A8" />
      <stop offset="35%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#936D08" />
    </linearGradient>

    <!-- Flag Red Accent Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  
  <!-- Outer Gold Border -->
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-opacity="0.9" />

  <!-- Subtle Top Tri-color Flag Ribbon -->
  <g opacity="0.85">
    <path d="M50 14h137v14H50z" fill="#B22234" />
    <path d="M187 14h138v14H187z" fill="#FFFFFF" />
    <path d="M325 14h137v14H325z" fill="#D4AF37" />
  </g>

  <!-- Central Crest: Shield / Nail Art Silhouette -->
  <g transform="translate(0, -10)">
    <!-- Golden Shield Contour -->
    <path d="M256 80 C340 80 400 110 400 180 C400 310 256 410 256 410 C256 410 112 310 112 180 C112 110 172 80 256 80 Z" 
          fill="#061A36" 
          stroke="url(#goldGrad)" 
          stroke-width="10" 
          filter="url(#goldGlow)" />

    <!-- Stylized Nail Polish / Sparkle Accent -->
    <circle cx="256" cy="190" r="110" fill="#0A2244" stroke="#1E40AF" stroke-width="4" opacity="0.6"/>

    <!-- Central Monogram 'V' with Nail Tip Flair -->
    <path d="M190 150 L235 320 C242 344 270 344 277 320 L322 150 L288 150 L256 280 L224 150 Z" 
          fill="url(#goldGrad)" />
    
    <!-- Star Accents (representing US & Excellence) -->
    <polygon points="256,120 262,136 279,136 265,146 270,162 256,152 242,162 247,146 233,136 250,136" fill="#FDE047" />
    <polygon points="175,190 179,201 190,201 181,208 184,219 175,212 166,219 169,208 160,201 171,201" fill="#FDE047" opacity="0.8" />
    <polygon points="337,190 341,201 352,201 343,208 346,219 337,212 328,219 331,208 322,201 333,201" fill="#FDE047" opacity="0.8" />
  </g>

  <!-- Bottom Banner: VIETNAIL -->
  <rect x="76" y="405" width="360" height="66" rx="20" fill="#06162E" stroke="url(#goldGrad)" stroke-width="4" />
  <text x="256" y="448" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#F8FAFC" letter-spacing="3">VIETNAIL GUIDE</text>
  <text x="256" y="468" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#F59E0B" letter-spacing="4">AI ASSISTANT</text>
</svg>