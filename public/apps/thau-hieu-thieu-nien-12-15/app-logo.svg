        fill="url(#teenGrad)" opacity="0.25" />

  <!-- Rising Growth Spark & Bridge of Connection -->
  <!-- Brain / Empathy Waves -->
  <path d="M44 56 Q52 44 60 52 T76 48" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)" />
  
  <!-- Teen Figure / Star Silhouette -->
  <circle cx="60" cy="38" r="8" fill="url(#warmShieldGrad)" />
  <path d="M50 64 C50 54 54 50 60 50 C66 50 70 54 70 64 Z" fill="#F8FAFC" />

