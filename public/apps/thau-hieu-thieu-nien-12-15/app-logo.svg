  <path d="M60 58 C60 58 56 54 54 54 C52 54 51 55.5 51 57 C51 59 53 60.5 60 64 C67 60.5 69 59 69 57 C69 55.5 68 54 66 54 C64 54 60 58 60 58 Z" fill="#EF4444" />

  <!-- Sparkles -->
  <path d="M34 32 L35.5 28 L37 32 L41 33.5 L37 35 L35.5 39 L34 35 L30 33.5 Z" fill="#FDE047" opacity="0.95" />
  <path d="M84 60 L85.5 57 L87 60 L90 61.5 L87 63 L85.5 66 L84 63 L81 61.5 Z" fill="#FDE047" opacity="0.85" />

