<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="babyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F43F5E" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Subtle Heart Aura -->
  <circle cx="60" cy="56" r="36" fill="url(#babyGrad)" opacity="0.12" />

  <!-- Heart Base Shape (Protection & Love) -->
  <path d="M60 78 C60 78 38 64 38 48 C38 40 44 34 52 34 C56.5 34 60 37.5 60 37.5 C60 37.5 63.5 34 68 34 C76 34 82 40 82 48 C82 64 60 78 60 78 Z" 
        fill="url(#babyGrad)" filter="url(#softGlow)" />

  <!-- Smiling Baby / Cradle Minimalist Cutout Inside Heart -->
  <ellipse cx="60" cy="50" rx="11" ry="10" fill="#FFFFFF" />
  <!-- Closed happy eyes -->
  <path d="M54 50 Q56 53 58 50" fill="none" stroke="#E11D48" stroke-width="1.8" stroke-linecap="round" />
  <path d="M62 50 Q64 53 66 50" fill="none" stroke="#E11D48" stroke-width="1.8" stroke-linecap="round" />
  <!-- Small smile -->
  <path d="M58 55 Q60 57.5 62 55" fill="none" stroke="#E11D48" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- Gentle Beanie / Hair curl -->
  <circle cx="60" cy="40" r="3.2" fill="#FDE047" />

  <!-- Sparkles -->
  <path d="M36 34 L38 30 L40 34 L44 36 L40 38 L38 42 L36 38 L32 36 Z" fill="#FDE047" opacity="0.9" />
  <path d="M80 64 L81.5 61 L83 64 L86 65.5 L83 67 L81.5 70 L80 67 L77 65.5 Z" fill="#FDE047" opacity="0.8" />

  <!-- Bottom Label -->
  <text x="60" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="900" fill="#F1F5F9" text-anchor="middle" letter-spacing="1">BÉ 0-36M</text>
</svg>
