<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07111D"/>
      <stop offset="50%" stop-color="#0B1A2C"/>
      <stop offset="100%" stop-color="#0E233D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF0D8"/>
      <stop offset="35%" stop-color="#E2C185"/>
      <stop offset="70%" stop-color="#BE974B"/>
      <stop offset="100%" stop-color="#EED7A1"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E2C185" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark Luxury Navy Badge -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Stylized D + Digital Node Monogram -->
  <g filter="url(#goldGlow)">
    <!-- Main Outer D Track -->
    <path d="M 32 30 H 72 C 90 30 102 44 102 64 C 102 84 90 98 72 98 H 32 V 30 Z" 
          stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Inner D Core Line -->
    <path d="M 47 45 H 68 C 78 45 85 53 85 64 C 85 75 78 83 68 83 H 47 V 45 Z" 
          stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>

    <!-- Digital Tech Circuit Node Stem & Ring -->
    <line x1="88" y1="40" x2="108" y2="24" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="108" cy="24" r="5" stroke="url(#goldGrad)" stroke-width="3.5" fill="#0B1A2C"/>
  </g>
</svg>
